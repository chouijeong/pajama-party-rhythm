<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
  />
  <meta name="theme-color" content="#050714" />
  <title>LINK-ER · Seoul City</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="linker.css" />
</head>
<body>
  <main class="stage" aria-label="LINK-ER capture view">
    <!-- ─── Background skyline ─────────────────────────────────────── -->
    <div class="sky" aria-hidden="true">
      <div class="sky__sun"></div>
      <div class="sky__haze"></div>
      <div class="sky__stars"></div>
    </div>

    <div class="city city--far" aria-hidden="true">
      <svg viewBox="0 0 800 1600" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="far-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3a5e8f" stop-opacity=".55" />
            <stop offset="100%" stop-color="#0c1733" stop-opacity=".95" />
          </linearGradient>
        </defs>
        <g fill="url(#far-grad)">
          <polygon points="0,1600 0,1080 60,1060 60,940 110,930 110,1010 165,1000 165,860 215,850 215,990 270,980 270,1600" />
          <polygon points="270,1600 270,940 320,925 320,1020 370,1015 370,820 420,810 420,950 470,940 470,1600" />
          <polygon points="470,1600 470,990 525,980 525,890 580,880 580,1020 640,1010 640,870 695,860 695,960 745,950 745,1020 800,1010 800,1600" />
        </g>
      </svg>
    </div>

    <div class="city city--mid" aria-hidden="true">
      <svg viewBox="0 0 800 1600" preserveAspectRatio="xMidYMax slice">
        <defs>
          <linearGradient id="mid-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4d7bb3" stop-opacity=".75" />
            <stop offset="100%" stop-color="#0a1226" stop-opacity="1" />
          </linearGradient>
        </defs>
        <g fill="url(#mid-grad)">
          <polygon points="0,1600 0,1180 70,1160 70,1080 140,1070 140,1170 220,1150 220,1010 290,1000 290,1180 360,1160 360,1600" />
          <polygon points="430,1600 430,1110 510,1090 510,990 580,980 580,1130 660,1110 660,1040 740,1030 740,1180 800,1170 800,1600" />
        </g>
        <!-- light streaks (road) -->
        <g class="streaks" stroke-linecap="round" fill="none" opacity=".75">
          <path d="M -20 1490 Q 280 1450 540 1500 T 820 1480"
                stroke="#ff5a5f" stroke-width="3" />
          <path d="M -20 1530 Q 320 1500 600 1545 T 820 1530"
                stroke="#ffa48a" stroke-width="2" />
        </g>
      </svg>
    </div>

    <!-- ─── Recognized building ────────────────────────────────────── -->
    <div class="recognized" aria-hidden="true">
      <svg viewBox="0 0 400 1100" preserveAspectRatio="xMidYMax meet">
        <defs>
          <linearGradient id="bldg-fill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#3870ff" stop-opacity=".55" />
            <stop offset="55%" stop-color="#0136FE" stop-opacity=".80" />
            <stop offset="100%" stop-color="#06133a" stop-opacity=".95" />
          </linearGradient>

          <linearGradient id="edge-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"  stop-color="#9cc1ff" />
            <stop offset="100%" stop-color="#0136FE" />
          </linearGradient>

          <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
            <path d="M16 0H0V16" fill="none"
                  stroke="rgba(150,195,255,.55)" stroke-width=".6" />
          </pattern>

          <pattern id="grid-fine" width="6" height="6" patternUnits="userSpaceOnUse">
            <path d="M6 0H0V6" fill="none"
                  stroke="rgba(120,180,255,.18)" stroke-width=".3" />
          </pattern>

          <filter id="blue-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <filter id="lime-glow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3" result="b" />
            <feMerge>
              <feMergeNode in="b" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>

          <clipPath id="bldg-clip">
            <path d="
              M 130 1100
              L 130 360
              L 148 290
              L 162 220
              L 178 150
              L 198 80
              L 222 40
              L 244 90
              L 256 180
              L 264 270
              L 270 360
              L 270 1100 Z" />
          </clipPath>
        </defs>

        <!-- silhouette fill -->
        <path class="bldg-fill" d="
          M 130 1100
          L 130 360
          L 148 290
          L 162 220
          L 178 150
          L 198 80
          L 222 40
          L 244 90
          L 256 180
          L 264 270
          L 270 360
          L 270 1100 Z"
          fill="url(#bldg-fill)" />

        <!-- subtle inner grid (fine) -->
        <rect x="130" y="40" width="140" height="1060"
              fill="url(#grid-fine)" clip-path="url(#bldg-clip)" />
        <!-- main wireframe grid -->
        <rect x="130" y="40" width="140" height="1060"
              fill="url(#grid)" clip-path="url(#bldg-clip)" opacity=".75" />

        <!-- window lights -->
        <g clip-path="url(#bldg-clip)" class="windows" fill="#cfe2ff">
          <rect x="160" y="320" width="3" height="3" opacity=".65" />
          <rect x="190" y="350" width="3" height="3" opacity=".5" />
          <rect x="222" y="410" width="3" height="3" opacity=".7" />
          <rect x="148" y="500" width="3" height="3" opacity=".45" />
          <rect x="208" y="540" width="3" height="3" opacity=".75" />
          <rect x="244" y="600" width="3" height="3" opacity=".55" />
          <rect x="175" y="680" width="3" height="3" opacity=".6" />
          <rect x="232" y="740" width="3" height="3" opacity=".7" />
          <rect x="158" y="830" width="3" height="3" opacity=".55" />
          <rect x="210" y="900" width="3" height="3" opacity=".5" />
          <rect x="245" y="970" width="3" height="3" opacity=".7" />
        </g>

        <!-- outline glow -->
        <path class="bldg-outline" d="
          M 130 1100
          L 130 360
          L 148 290
          L 162 220
          L 178 150
          L 198 80
          L 222 40
          L 244 90
          L 256 180
          L 264 270
          L 270 360
          L 270 1100"
          fill="none" stroke="url(#edge-grad)" stroke-width="1.6"
          filter="url(#blue-glow)" />

        <!-- ─── Vertical route ────────────────────────────────────── -->
        <g class="route" filter="url(#lime-glow)">
          <!-- connecting line: zig-zag from top to base -->
          <polyline class="route__line" fill="none"
            stroke="#B7F701" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"
            points="
              215,70  225,120 208,170 222,225 200,278
              218,330 195,380 213,432 192,486 215,540
              198,594 220,648 200,702 217,756 197,810
              215,862 195,914 218,966 200,1020 215,1062" />

          <!-- nodes (rotated squares = diamonds) -->
          <g class="route__nodes" fill="#B7F701">
            <rect x="212" y="67" width="6" height="6" />
            <rect x="222" y="117" width="6" height="6" />
            <rect x="205" y="167" width="6" height="6" />
            <rect x="219" y="222" width="6" height="6" />
            <rect x="197" y="275" width="6" height="6" />
            <rect x="215" y="327" width="6" height="6" />
            <rect x="192" y="377" width="6" height="6" />
            <rect x="210" y="429" width="6" height="6" />
            <rect x="189" y="483" width="6" height="6" />
            <rect x="212" y="537" width="6" height="6" />
            <rect x="195" y="591" width="6" height="6" />
            <rect x="217" y="645" width="6" height="6" />
            <rect x="197" y="699" width="6" height="6" />
            <rect x="214" y="753" width="6" height="6" />
            <rect x="194" y="807" width="6" height="6" />
            <rect x="212" y="859" width="6" height="6" />
            <rect x="192" y="911" width="6" height="6" />
            <rect x="215" y="963" width="6" height="6" />
            <rect x="197" y="1017" width="6" height="6" />
            <rect x="212" y="1059" width="6" height="6" />
          </g>
        </g>
      </svg>
    </div>

    <!-- ─── Top HUD: back + title ──────────────────────────────────── -->
    <header class="hud-top">
      <button class="back" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 5L8 12l7 7" fill="none" stroke="currentColor"
                stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="title">
        <h1>Seoul<br/>City</h1>
        <p>South Korea</p>
      </div>
    </header>

    <!-- ─── Preview card (captured structure) ──────────────────────── -->
    <aside class="capture" aria-label="Captured structure preview">
      <div class="capture__ring"></div>
      <div class="capture__thumb" role="img" aria-label="Captured building">
        <svg viewBox="0 0 110 130" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="thumb-sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"  stop-color="#15234a" />
              <stop offset="100%" stop-color="#0a132d" />
            </linearGradient>
            <linearGradient id="thumb-bldg" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%"  stop-color="#d9b178" />
              <stop offset="55%" stop-color="#a07a44" />
              <stop offset="100%" stop-color="#5b441e" />
            </linearGradient>
          </defs>
          <rect width="110" height="130" fill="url(#thumb-sky)" />
          <!-- far buildings -->
          <g fill="#1b2a4d" opacity=".85">
            <rect x="0"  y="78" width="22" height="60" />
            <rect x="22" y="70" width="18" height="68" />
            <rect x="86" y="74" width="24" height="64" />
          </g>
          <!-- main warm building -->
          <polygon points="38,130 38,46 52,38 70,32 80,38 80,130"
                   fill="url(#thumb-bldg)" />
          <!-- windows -->
          <g fill="#fff4d6" opacity=".55">
            <rect x="44" y="55" width="2" height="3" />
            <rect x="52" y="62" width="2" height="3" />
            <rect x="60" y="58" width="2" height="3" />
            <rect x="68" y="68" width="2" height="3" />
            <rect x="48" y="80" width="2" height="3" />
            <rect x="62" y="86" width="2" height="3" />
            <rect x="72" y="92" width="2" height="3" />
            <rect x="50" y="104" width="2" height="3" />
            <rect x="64" y="112" width="2" height="3" />
          </g>
        </svg>
      </div>
      <span class="capture__badge" aria-label="4 captured">4</span>
    </aside>

    <!-- ─── Zoom controls ──────────────────────────────────────────── -->
    <div class="zoom" role="group" aria-label="Zoom">
      <button type="button" class="zoom__btn" aria-label="Zoom in">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor"
                stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
      <button type="button" class="zoom__btn" aria-label="Zoom out">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14" fill="none" stroke="currentColor"
                stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- ─── Bottom action ──────────────────────────────────────────── -->
    <footer class="action">
      <div class="action__pill" aria-hidden="true">
        <span class="action__chevrons">
          <svg viewBox="0 0 24 24"><path d="M8 6l6 6-6 6" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round"/></svg>
          <svg viewBox="0 0 24 24"><path d="M8 6l6 6-6 6" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round"/></svg>
        </span>
      </div>
      <button class="action__btn" type="button" aria-label="Start route generation">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h11M11 6l5 6-5 6" fill="none" stroke="currentColor"
                stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </footer>

    <!-- film grain overlay -->
    <div class="grain" aria-hidden="true"></div>
  </main>

  <script src="linker.js" defer></script>
</body>
</html>
